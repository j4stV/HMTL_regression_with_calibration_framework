[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmtl"
version = "0.1.0"
description = "Hierarchical Multi-Task Learning with conformal calibration — AutoML-style API for tabular data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.16"]
dev = ["pytest>=7.4"]

[project.scripts]
hmtl = "src.hmtl.cli:main"

[tool.setuptools]
# The repo uses an import path of ``src.*`` rather than a top-level package,
# so we expose the source tree directly.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
