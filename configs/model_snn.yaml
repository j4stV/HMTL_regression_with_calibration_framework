encoder:
  input_dim: null  # будет заполнено автоматически
  hidden_width: 128
  depth_base: 12
  depth_hmtl: 18
  alpha_dropout: 0.0003
  residual: false  # V6: disabled per local A/B (−41…−93% RMSE on mip2016/topo_2_1/abalone). See experiments/ab_research/summary.md
  activation: SELU
  init: lecun

hmtl:
  enabled: true
  aux_task: contrastive  # "bins", "contrastive", "reconstruction", "rank", "multi", "auto"
  low_layer: 12  # First 12 layers (2/3 of 18)
  high_layer: 18  # Total 18 layers
  lambda_aux: 0.5  # Weight 0.5  (loss_weights for projection)
  n_bins: 5  # Used only if aux_task="bins"
  proj_dim: 50  # Projection dimension 50
  # Multi-aux settings (when aux_task="multi")
  # multi_aux_tasks: [contrastive, reconstruction]
  # multi_aux_weights:
  #   contrastive: 0.5
  #   reconstruction: 0.3
  # Auto-selection settings (when aux_task="auto")
  # auto_pilot_epochs: 30
  # auto_candidates: [bins, contrastive, reconstruction, rank]

regression_head:
  out_mu: 1
  out_sigma: 1
  # scale_coeff is computed automatically from target std
